<!-- @dsCard group="Paywall" height=520 subtitle="RestoreCloseHeader, LegalFooter (one line at 12 and 10), LoadingOverlay; English and Arabic" -->
<!doctype html>
<html>
<head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow"><title>PaywallChrome — preview</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  body { margin:0; min-height:100vh; background:var(--gradient-background); color:var(--text-primary); }
  .label { color:var(--text-tertiary); padding:12px 16px 4px; }
  * { box-sizing:border-box; }
  .w { width:390px; }
  .hdr { height:44px; padding:0 12px; display:flex; align-items:center; }
  .close { width:64px; height:44px; display:flex; align-items:center; justify-content:center; }
  .close img { width:24px; height:24px; } /* file ink #D1DCEA = --icon-primary, so no tint is needed */
  .sp { flex:1; }
  .restore { color:var(--text-secondary); padding:0 8px; height:44px; display:flex; align-items:center; }
  .legal { display:flex; justify-content:center; align-items:center; height:17px; padding:14px 0; white-space:nowrap; }
  .legal a { color:var(--text-secondary); text-decoration:none; }
  .legal i { font-style:normal; color:var(--separator-primary); padding:0 5px; }
  .s12 { font-size:12px; } .s10 { font-size:10px; }
  .ov { position:relative; height:200px; background:var(--gradient-background); }
  .ov::before { content:""; position:absolute; inset:0; background:#000; opacity:0.6; }
  .box { position:absolute; left:50%; top:50%; width:75px; height:75px; margin:-37.5px 0 0 -37.5px; border-radius:var(--radius-loadingBox); background:var(--loadingBox);
         display:flex; align-items:center; justify-content:center; }
</style></head>
<body>
<div class="label Caption">RestoreCloseHeader</div>
<div class="w hdr"><span class="close"><img src="../../assets/Icons/Close.svg" alt=""></span><span class="sp"></span><span class="restore Body1">Restore</span></div>
<div class="w hdr" dir="rtl" lang="ar"><span class="close"><img src="../../assets/Icons/Close.svg" alt=""></span><span class="sp"></span><span class="restore Body1">استعادة</span></div>
<div class="label Caption">LegalFooter · fits at 12</div>
<div class="w legal Caption s12"><a>Privacy Policy</a><i>•</i><a>Terms of Use</a><i>•</i><a>About Subscription</a></div>
<div class="w legal Caption s12" dir="rtl" lang="ar"><a>سياسة الخصوصية</a><i>•</i><a>شروط الاستخدام</a><i>•</i><a>حول الاشتراك</a></div>
<div class="label Caption">LegalFooter · narrow width</div>
<div class="w legal Caption s10"><a>Privacy Policy</a><i>•</i><a>Terms of Use</a><i>•</i><a>About Subscription</a></div>
<div class="label Caption">LoadingOverlay (spinner stand-in)</div>
<div class="w ov"><div class="box"><svg width="37" height="37" viewBox="0 0 37 37"><circle cx="18.5" cy="18.5" r="14" fill="none" stroke="var(--loadingTint)" stroke-width="3.5" stroke-dasharray="60 28" stroke-linecap="round"/></svg></div></div>
</body>
</html>
