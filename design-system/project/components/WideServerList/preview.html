<!-- @dsCard group="Server list" height=900 subtitle="iPad server column: search, Auto card, FREE and PREMIUM cards, selected and locked rows; English and Arabic" -->
<!doctype html>
<html>
<head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow"><title>WideServerList — preview</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  body { margin:0; min-height:100vh; background:#000; color:var(--text-primary); display:flex; flex-wrap:wrap; gap:24px; }
  /* iPad: Theme.typography x1.3 (DeviceClass.scaleFont) */
  .ipad .H4 { font-size:44.2px; line-height:48.6px; }
  .ipad .Body1, .ipad .Body2 { font-size:19.5px; line-height:27.3px; }
  .col { width:400px; background:var(--gradient-background); padding-bottom:24px; }
  .title { padding:28px 20px 12px; }
  .search { margin:0 16px 8px; height:44px; padding:0 12px; border-radius:var(--radius-field); background:var(--fieldFill);
            display:flex; align-items:center; gap:8px; color:var(--text-tertiary); font-family:system-ui, sans-serif; font-size:17px; }
  .search .q { color:var(--text-primary); flex:1; }
  .list { padding:8px 16px 0; display:flex; flex-direction:column; gap:18px; }
  .group { display:flex; flex-direction:column; gap:8px; }
  .hdr { padding:0 8px; display:flex; align-items:center; gap:6px; text-transform:uppercase; color:var(--text-tertiary); }
  .hdr.prem { color:var(--text-quaternary); } .hdr img { width:16px; height:16px; }
  .card { position:relative; border-radius:var(--radius-gradientCard); background:var(--background-secondary); box-shadow: inset 1px 1px 2px 0 var(--highlight); }
  .card::before { content:""; position:absolute; inset:0; border-radius:inherit; padding:1px; background:var(--gradient-border);
          -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; }
  .sep { height:1px; width:95.3%; margin-inline-start:auto; background:var(--separator-secondary); }
  .row { position:relative; height:56px; padding:0 14px; display:flex; align-items:center; gap:14px; }
  .row.sel::after { content:""; position:absolute; inset:0 6px; border-radius:var(--radius-rowHighlight); background:var(--background-tertiary); opacity:0.16; }
  .row > * { position:relative; z-index:1; }
  .row img { width:32px; height:32px; flex:none; }
  .row .name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sp { flex:1; min-width:8px; }
  .sig { --s:20px; width:var(--s); height:var(--s); display:flex; align-items:flex-end; gap:calc(var(--s) * 0.1667 / 2); flex:none; }
  .sig i { width:calc(var(--s) * 0.1667); border-radius:var(--radius-signalBar); background:var(--gradient-border); }
  .sig i:nth-child(1) { height:calc(var(--s) * 0.1667); } .sig i:nth-child(2) { height:calc(var(--s) * 0.375); }
  .sig i:nth-child(3) { height:calc(var(--s) * 0.5833); } .sig i:nth-child(4) { height:calc(var(--s) * 0.7917); }
  .sig { --sc:var(--background-tertiary); } .sig.auto { --sc:var(--text-error); }
  .sig.f2 i:nth-child(-n+2), .sig.f4 i { background:var(--sc); }
  .sym { flex:none; }
  .empty { padding-top:40px; text-align:center; color:var(--text-tertiary); }
</style></head>
<body>
<!-- SF Symbol stand-ins (not assets): magnifyingglass, xmark.circle.fill, lock.fill, checkmark.circle.fill -->
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="mag" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="xm" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="currentColor"/><path d="M7 7l6 6M13 7l-6 6" stroke="#000" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="lock" viewBox="0 0 12 14"><rect x="1" y="6" width="10" height="8" rx="1.5" fill="currentColor"/><path d="M3.2 6V4.2a2.8 2.8 0 0 1 5.6 0V6" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="chk" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="currentColor"/><path d="M5.5 10.2l3 3 6-6.4" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>

<div class="col ipad" lang="en">
  <div class="title H4">Server location</div>
  <div class="search"><svg class="sym" width="20" height="20"><use href="#mag"/></svg><span>Search locations</span></div>
  <div class="list">
    <div class="group"><div class="card">
      <div class="row"><img src="../../assets/Flags/EARTH.svg" alt=""><span class="name Body1">Auto Location</span><span class="sp"></span><span class="sig f2 auto"><i></i><i></i><i></i><i></i></span></div>
    </div></div>
    <div class="group"><div class="hdr Body2">Free</div><div class="card">
      <div class="row sel"><img src="../../assets/Flags/DE.svg" alt=""><span class="name Body1">Germany</span><span class="sp"></span><span class="sig f2"><i></i><i></i><i></i><i></i></span><svg class="sym" width="20" height="20" style="color:var(--background-tertiary)"><use href="#chk"/></svg></div>
      <div class="sep"></div>
      <div class="row"><img src="../../assets/Flags/NL.svg" alt=""><span class="name Body1">Netherlands</span><span class="sp"></span><span class="sig f2"><i></i><i></i><i></i><i></i></span></div>
    </div></div>
    <div class="group"><div class="hdr prem Body2"><img src="../../assets/Logos/Premium.png" alt="">Premium</div><div class="card">
      <div class="row"><img src="../../assets/Flags/US.svg" alt=""><span class="name Body1">United States</span><span class="sp"></span><svg class="sym" width="11" height="13" style="color:var(--text-quaternary)"><use href="#lock"/></svg><span class="sig f4"><i></i><i></i><i></i><i></i></span></div>
      <div class="sep"></div>
      <div class="row"><img src="../../assets/Flags/GB.svg" alt=""><span class="name Body1">United Kingdom</span><span class="sp"></span><svg class="sym" width="11" height="13" style="color:var(--text-quaternary)"><use href="#lock"/></svg><span class="sig f4"><i></i><i></i><i></i><i></i></span></div>
    </div></div>
  </div>
</div>

<div class="col ipad" dir="rtl" lang="ar">
  <div class="title H4">موقع الخادم</div>
  <div class="search"><svg class="sym" width="20" height="20"><use href="#mag"/></svg><span class="q">ألم</span><svg class="sym" width="18" height="18"><use href="#xm"/></svg></div>
  <div class="list">
    <div class="group"><div class="hdr Body2">مجاني</div><div class="card">
      <div class="row sel"><img src="../../assets/Flags/DE.svg" alt=""><span class="name Body1">ألمانيا</span><span class="sp"></span><span class="sig f2"><i></i><i></i><i></i><i></i></span><svg class="sym" width="20" height="20" style="color:var(--background-tertiary)"><use href="#chk"/></svg></div>
    </div></div>
    <div class="group"><div class="hdr prem Body2"><img src="../../assets/Logos/Premium.png" alt="">بريميوم</div><div class="card">
      <div class="row"><img src="../../assets/Flags/US.svg" alt=""><span class="name Body1">الولايات المتحدة</span><span class="sp"></span><svg class="sym" width="11" height="13" style="color:var(--text-quaternary)"><use href="#lock"/></svg><span class="sig f4"><i></i><i></i><i></i><i></i></span></div>
    </div></div>
  </div>
</div>

<div class="col ipad" dir="rtl" lang="ar">
  <div class="title H4">موقع الخادم</div>
  <div class="search"><svg class="sym" width="20" height="20"><use href="#mag"/></svg><span class="q">xyz</span><svg class="sym" width="18" height="18"><use href="#xm"/></svg></div>
  <div class="list"><div class="empty Body1">لا يوجد موقع</div></div>
</div>
</body>
</html>
