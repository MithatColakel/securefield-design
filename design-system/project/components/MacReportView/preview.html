<!-- @dsCard group="Mac" height=720 width=1000 subtitle="Mac report sheet (480 × 640): kind list, details field, attach toggle, Cancel / Send; sent message; English and Arabic" -->
<!doctype html>
<html>
<head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow"><title>MacReportView — preview</title>
<style>
  body { margin:0; padding:16px; min-height:100vh; box-sizing:border-box; background:#000; color:var(--white); display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start; }
  figure { margin:0; } figcaption { color:var(--mediumGray); margin-bottom:6px; }
  .lg { color:var(--lightGray); } .mg { color:var(--mediumGray); } .y { color:var(--lightYellow); } .gr { color:var(--lightGreen); }
  .btn { display:flex; align-items:center; justify-content:center; border-radius:var(--radius-pill); color:var(--white); box-sizing:border-box; padding:0 16px; text-align:center; width:100%; }
  .primary { min-height:48px; background:var(--gradient-macPrimary); }
  [dir="rtl"] .primary { background:linear-gradient(270deg, var(--lightBlue), var(--green)); }
  .premium { min-height:52px; background:var(--gradient-premium); color:var(--onPremium); }
  .outline { min-height:44px; background:var(--surface); border:1.5px solid var(--hairline); }
  .card { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius-card); }
  .c { text-align:center; }

  .rp { width:480px; height:640px; box-sizing:border-box; padding:24px; display:flex; flex-direction:column; gap:16px; background:var(--sheetBackground); overflow:hidden; }
  .kl { display:flex; flex-direction:column; } .k { display:flex; align-items:center; padding:10px 16px; } .sp { flex:1; } .hl { height:1px; background:var(--hairline); }
  .kr { width:16px; height:16px; border-radius:50%; border:1.5px solid var(--auroMetalGray); box-sizing:border-box; position:relative; flex:none; }
  .kr.on { border:1.5px solid var(--lightGreen); } .kr.on::after { content:""; position:absolute; inset:3px; border-radius:50%; background:var(--lightGreen); }
  .ta { height:84px; border-radius:var(--radius-field); flex:none; }
  .tg { display:flex; gap:8px; align-items:flex-start; } .tv { display:flex; flex-direction:column; gap:2px; }
  .cb { width:16px; height:16px; border-radius:4px; background:var(--lightGreen); color:#0b121c; display:flex; align-items:center; justify-content:center; flex:none; margin-top:3px; } .cb svg { width:12px; height:12px; }
  .bt { display:flex; gap:12px; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- SF Symbol stand-ins (the symbols are not in the repo). Simple shapes, not Apple's drawings. -->
  <symbol id="power" viewBox="0 0 24 24"><path d="M12 2.5v9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M6.2 5.8a8.5 8.5 0 1 0 11.6 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="crown" viewBox="0 0 24 24"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5z" fill="currentColor"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10.5" rx="2" fill="currentColor"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
  <symbol id="chev-f" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="chev-b" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="xfill" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M8 8l8 8M16 8l-8 8" stroke="#0e1621" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2.3"/></symbol>
  <symbol id="question" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.3 9.3a2.8 2.8 0 1 1 3.8 2.6c-.8.4-1.1.9-1.1 1.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1.1" fill="currentColor"/></symbol>
  <symbol id="exclam" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 6.8v6.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1.1" fill="currentColor"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="checkfill" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M7 12.3l3.4 3.4L17 9" fill="none" stroke="#0b121c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="shieldlock" viewBox="0 0 24 24"><path d="M12 2l8 3v6.5c0 5-3.4 8.8-8 10.5-4.6-1.7-8-5.5-8-10.5V5z" fill="currentColor"/></symbol>
  <symbol id="bolt" viewBox="0 0 24 24"><path d="M13.5 2L5 13.5h6L10 22l9-12h-6z" fill="currentColor"/></symbol>
  <symbol id="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="shieldhalf" viewBox="0 0 24 24"><path d="M12 2l8 3v6.5c0 5-3.4 8.8-8 10.5-4.6-1.7-8-5.5-8-10.5V5z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v20c-4.6-1.7-8-5.5-8-10.5V5z" fill="currentColor"/></symbol>
  <symbol id="wand" viewBox="0 0 24 24"><path d="M4 20L15 9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M17 2l1 3 3 1-3 1-1 3-1-3-3-1 3-1zM8 3l.6 1.6L10 5l-1.4.6L8 7l-.6-1.4L6 5l1.4-.4z" fill="currentColor"/></symbol>
</defs></svg>
<figure><figcaption class="caption">first kind selected, attach on</figcaption><div class="rp" dir="ltr" lang="en"><div class="headline">Report a problem</div><div class="body lg">If you have a problem with Securefield, tell us. We read every report.</div><div class="bodyBold">What happened?</div>
<div class="card kl"><div class="k"><span class="body">Unable to connect</span><span class="sp"></span><span class="kr on"></span></div><div class="hl"></div><div class="k"><span class="body">Connected but no internet</span><span class="sp"></span><span class="kr"></span></div><div class="hl"></div><div class="k"><span class="body">Low speed connection</span><span class="sp"></span><span class="kr"></span></div><div class="hl"></div><div class="k"><span class="body">Premium membership issue</span><span class="sp"></span><span class="kr"></span></div><div class="hl"></div><div class="k"><span class="body">Other</span><span class="sp"></span><span class="kr"></span></div></div><div class="bodyBold">Details (optional)</div><div class="card ta"></div>
<div class="tg"><span class="cb"><svg><use href="#check"/></svg></span><span class="tv"><span class="body">Attach connection details</span><span class="caption mg">Version, protocol, server and error code. No browsing data, no personal data.</span></span></div>
<div class="bt"><div class="btn outline bodyBold">Cancel</div><div class="btn primary bodyBold" style="min-height:44px">Send</div></div></div></figure>
<figure><figcaption class="caption">العربية — بعد الإرسال</figcaption><div class="rp" dir="rtl" lang="ar"><div class="headline">الإبلاغ عن مشكلة</div><div class="body lg">إذا واجهت مشكلة في استخدام Securefield فأخبرنا. نقرأ كل بلاغ.</div><div class="bodyBold">ماذا حدث؟</div>
<div class="card kl"><div class="k"><span class="body">غير قادر على الاتصال</span><span class="sp"></span><span class="kr"></span></div><div class="hl"></div><div class="k"><span class="body">متصل ولكن لا يوجد إنترنت</span><span class="sp"></span><span class="kr on"></span></div><div class="hl"></div><div class="k"><span class="body">اتصال بطيء</span><span class="sp"></span><span class="kr"></span></div><div class="hl"></div><div class="k"><span class="body">مشكلة في الاشتراك المميز</span><span class="sp"></span><span class="kr"></span></div><div class="hl"></div><div class="k"><span class="body">أخرى</span><span class="sp"></span><span class="kr"></span></div></div><div class="bodyBold">تفاصيل (اختياري)</div><div class="card ta"></div>
<div class="tg"><span class="cb"><svg><use href="#check"/></svg></span><span class="tv"><span class="body">إرفاق تفاصيل الاتصال</span><span class="caption mg">الإصدار والبروتوكول والخادم ورمز الخطأ. بلا بيانات تصفح ولا بيانات شخصية.</span></span></div>
<div class="bt"><div class="btn outline bodyBold">إلغاء</div><div class="btn primary bodyBold" style="min-height:44px">إرسال</div></div><div class="caption y">شكرًا لك. تم إرسال بلاغك.</div></div></figure>
</body>
</html>
