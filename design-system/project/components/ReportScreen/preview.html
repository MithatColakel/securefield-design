<!-- @dsCard group="Report" height=1820 subtitle="Report a problem at 390 × 844 (English, Arabic, connected) and the iPad form sheet at 540; ReportRow and ReportItem" -->
<!doctype html>
<html>
<head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow"><title>ReportScreen — preview</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#000; color:var(--text-primary); display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start; }
  /* iPhone values; .tablet multiplies the type and icon sizes by 1.3 (DeviceClass.scaleFont) */
  .screen { --lw:390px; --rowH:60px; --circle:34px; --glyph:17px; --chev:13px; --exp:14px; --expLH:19.6px; --btnFont:15px;
            position:relative; width:var(--lw); height:844px; overflow:hidden; background:var(--gradient-background);
            display:flex; flex-direction:column; padding-bottom:34px; }
  .screen.tablet { --lw:540px; --rowH:72px; --circle:44.2px; --glyph:22.1px; --chev:16.9px; --exp:18.2px; --expLH:25.5px; --btnFont:19.5px; height:720px; padding-bottom:0; }
  .tablet .Subtitle1 { font-size:22.1px; line-height:24.8px; }
  .tablet .Body1 { font-size:19.5px; line-height:27.3px; }
  .hdr { position:relative; padding:25px 20px 20px; text-align:center; flex:none; }
  .close { position:absolute; top:0; inset-inline-start:10px; width:75px; height:75px; display:flex; align-items:center; justify-content:center;
           font-family:system-ui, sans-serif; font-size:20px; font-weight:700; color:var(--text-primary); }
  .scroll { flex:1; min-height:0; overflow:hidden; padding:4px 20px 16px; display:flex; flex-direction:column; gap:12px;
            -webkit-mask-image:linear-gradient(to bottom, #000 0, #000 calc(100% - 24px), transparent 100%); mask-image:linear-gradient(to bottom, #000 0, #000 calc(100% - 24px), transparent 100%); }
  .exp { font-family:var(--font-redhat); font-size:var(--exp); line-height:var(--expLH); letter-spacing:0.04px; color:var(--text-tertiary); text-align:center; padding:0 6px 10px; }
  .conn { text-align:center; padding-bottom:4px; }
  /* ReportRow: GradientBorderCard radius 18 */
  .row { position:relative; flex:none; height:var(--rowH); border-radius:18px; background:var(--background-secondary);
         box-shadow:inset 1px 1px 2px 0 rgba(255,255,255,0.25); display:flex; align-items:center; gap:14px; padding:0 14px; }
  .row::before { content:""; position:absolute; inset:0; border-radius:inherit; padding:1px; background:var(--gradient-border);
         -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; }
  .ic { flex:none; width:var(--circle); height:var(--circle); border-radius:50%; background:rgba(53,223,145,0.12); color:var(--text-secondary);
        display:flex; align-items:center; justify-content:center; }
  .ic svg { width:var(--glyph); height:var(--glyph); }
  .row .Body1 { flex:1; text-align:start; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .chev { flex:none; width:var(--chev); height:var(--chev); color:var(--text-tertiary); opacity:0.7; }
  [dir=rtl] .chev { transform:scaleX(-1); }
  .pin { flex:none; padding:8px 20px 12px; }
  .btn { display:flex; align-items:center; justify-content:center; height:56px; border-radius:18px; font-family:var(--font-namu); font-size:var(--btnFont);
         color:var(--text-primary); background:var(--gradient-controlGreen); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.1); }
  .cap { color:var(--text-tertiary); width:100%; padding:12px 16px 0; }
</style></head>
<body>
<div class="cap Caption">iPhone 390 × 844 · English idle · Arabic idle · English while connected</div>
<div id="en" class="screen" lang="en"></div>
<div id="ar" class="screen" dir="rtl" lang="ar"></div>
<div id="enc" class="screen" lang="en"></div>
<div class="cap Caption">iPad form sheet (layout width 540, tablet scale ×1.3) · English and Arabic</div>
<div id="pad" class="screen tablet" lang="en"></div>
<div id="padar" class="screen tablet" dir="rtl" lang="ar"></div>
<script>
// SF Symbol stand-ins (not in the repo; the app draws the system symbols).
const G = {
  'arrow.clockwise': '<path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/>',
  'xmark.shield': '<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/>',
  'wifi.exclamationmark': '<path d="M2 9.5a13 13 0 0 1 15-3"/><path d="M5.5 13a8 8 0 0 1 9-1.6"/><circle cx="10" cy="17" r="1.2" fill="currentColor"/><path d="M20 7v8"/><circle cx="20" cy="19" r="1.2" fill="currentColor"/>',
  'crown': '<path d="M4 17L3 7l5 4 4-6 4 6 5-4-1 10z"/><path d="M4 20h16"/>',
  'tortoise': '<path d="M3 16c0-4.5 3.5-8 8-8s8 3.5 8 8z"/><path d="M19 14h1.5a1.75 1.75 0 0 0 0-3.5H19"/><path d="M6 16v3M16 16v3"/>',
  'gift': '<rect x="3" y="8" width="18" height="5"/><rect x="5" y="13" width="14" height="8"/><path d="M12 8v13"/><path d="M12 8C10 4 6 4 6 6.5S10 8 12 8c2 0 6 1 6-1.5S14 4 12 8"/>',
  'play.slash': '<path d="M7 5l12 7-12 7z"/><path d="M4 3l17 18"/>'
};
const svg = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${G[n]}</svg>`;
const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg>';
// iconScale per row (ReportType.iconScale)
const ICONS = ['arrow.clockwise','xmark.shield','wifi.exclamationmark','crown','tortoise','gift','play.slash'];
const SCALE = [1, 1, 1.10, 1.05, 1.10, 1, 1.05];
const T = {
  en: { title:'Report a problem', connected:'You are connected', btn:'No problem to report',
        exp:'If you encounter a problem using Securefield VPN, you can use this function in our apps to alert our team. By reporting any issues you find, you help us to ensure Securefield VPN continues to provide a reliable VPN service to our community.',
        rows:['Reset server list','Unable to connect','Connected but no internet','Premium/free membership issue','Low speed connection','Ad reward not received',"Can't watch ads"] },
  ar: { title:'الإبلاغ عن مشكلة', connected:'أنت متصل', btn:'لا توجد مشكلة للإبلاغ عنها',
        exp:'إذا واجهت مشكلة في استخدام Securefield VPN، يمكنك استخدام هذه الوظيفة في تطبيقاتنا لإشعار فريقنا. من خلال الإبلاغ عن أي مشاكل تجدها، تساعدنا في ضمان استمرار Securefield VPN في تقديم خدمة VPN موثوقة لمجتمعنا.',
        rows:['إعادة ضبط قائمة الخوادم','غير قادر على الاتصال','متصل ولكن لا يوجد إنترنت','مشكلة في الاشتراك المجاني/المميز','اتصال بطيء','لم يتم استلام مكافأة الإعلان','لا يمكن مشاهدة الإعلانات'] }
};
function build(id, lang, connected) {
  const t = T[lang];
  const rows = t.rows.map((r, i) =>
    `<div class="row"><span class="ic"><span style="display:flex;transform:scale(${SCALE[i]})">${svg(ICONS[i])}</span></span><span class="Body1">${r}</span>${chev}</div>`).join('');
  document.getElementById(id).innerHTML =
    `<div class="hdr"><div class="Subtitle1">${t.title}</div><div class="close">✕</div></div>
     <div class="scroll"><div class="exp">${t.exp}</div>${connected ? `<div class="Body1 conn">${t.connected}</div>` : ''}${rows}</div>
     <div class="pin"><div class="btn">${t.btn}</div></div>`;
}
build('en','en',false); build('ar','ar',false); build('enc','en',true); build('pad','en',false); build('padar','ar',false);
</script>
</body>
</html>
