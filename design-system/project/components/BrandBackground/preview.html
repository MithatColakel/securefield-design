<!-- @dsCard group="Mac" height=420 width=1000 subtitle="Mac page background: graphite to black, world map in overlay blend; with map (first launch) and without (main window, panel)" -->
<!doctype html>
<html>
<head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow"><title>BrandBackground — preview</title>
<style>
  body { margin:0; padding:16px; background:#000; color:var(--white); display:flex; gap:16px; flex-wrap:wrap; }
  figure { margin:0; } figcaption { color:var(--lightGray); padding:6px 0; }
  /* LinearGradient(graphite → black, .topLeading → .bottomTrailing): unit-space corner to corner = CSS "to bottom right". */
  .bg { position:relative; width:300px; height:340px; overflow:hidden; background:linear-gradient(to bottom right, var(--bgGraphit), var(--bgBlack)); }
  [dir="rtl"] .bg { background:linear-gradient(to bottom left, var(--bgGraphit), var(--bgBlack)); }
  .bg img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; mix-blend-mode:overlay; }
</style></head>
<body>
  <figure><div class="bg"><img src="../../assets/Images/World-Map.png" alt=""></div><figcaption class="caption">showsMap = true (welcome, permission)</figcaption></figure>
  <figure><div class="bg"></div><figcaption class="caption">no map (main window detail, panel)</figcaption></figure>
  <figure dir="rtl" lang="ar"><div class="bg"><img src="../../assets/Images/World-Map.png" alt=""></div><figcaption class="caption">العربية (الاتجاه معكوس، للتأكيد)</figcaption></figure>
</body>
</html>
