<!-- @dsCard group="Main screen" height=230 subtitle="Free user (crown) and premium user; English and Arabic" -->
<!doctype html>
<html>
<head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow"><title>MainHeader — preview</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  body { margin:0; min-height:100vh; background:var(--gradient-background); color:var(--text-primary); }
  .label { color:var(--text-tertiary); padding:10px 16px 4px; }
  .hdr { width:390px; display:flex; align-items:center; }
  .slot { width:80px; height:40px; display:flex; align-items:center; justify-content:center; flex:none; }
  .half { width:40px; height:40px; display:flex; align-items:center; justify-content:center; }
  .logo { width:107.55px; height:40px; object-fit:contain; margin:0 auto; }
  .tpl { width:20px; height:20px; background:var(--icon-primary); -webkit-mask:url(../../assets/Icons/Warning.png) center / contain no-repeat; mask:url(../../assets/Icons/Warning.png) center / contain no-repeat; }
  .i24 { width:24px; height:24px; }
</style></head>
<body>
<div class="label Caption">free user — crown (icons/Premium) opens the paywall</div>
<div class="hdr"><div class="slot"><img class="i24" src="../../assets/Icons/Premium.svg" alt=""></div><img class="logo" src="../../assets/Logos/App-Logo.png" alt="Securefield"><div class="slot"><span class="half"><span class="tpl"></span></span><span class="half"><img class="i24" src="../../assets/Icons/Settings.svg" alt=""></span></div></div>
<div class="label Caption">premium user — empty slot</div>
<div class="hdr"><div class="slot"></div><img class="logo" src="../../assets/Logos/App-Logo.png" alt="Securefield"><div class="slot"><span class="half"><span class="tpl"></span></span><span class="half"><img class="i24" src="../../assets/Icons/Settings.svg" alt=""></span></div></div>
<div class="label Caption" dir="rtl">العربية — the slots swap sides</div>
<div class="hdr" dir="rtl"><div class="slot"><img class="i24" src="../../assets/Icons/Premium.svg" alt=""></div><img class="logo" src="../../assets/Logos/App-Logo.png" alt="Securefield"><div class="slot"><span class="half"><span class="tpl"></span></span><span class="half"><img class="i24" src="../../assets/Icons/Settings.svg" alt=""></span></div></div>
</body>
</html>
