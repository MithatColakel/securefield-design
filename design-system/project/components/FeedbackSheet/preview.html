<!-- @dsCard group="Report" height=2120 subtitle="Satisfaction card over the dim at 390 × 844 and on an 820 × 1180 iPad; English and Arabic" -->
<!doctype html>
<html>
<head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow"><title>FeedbackSheet — preview</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#000; color:var(--text-primary); display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start; }
  .cap { color:var(--text-tertiary); width:100%; padding:12px 16px 0; }
  .screen { --W:390px; --H:844px; --btnFont:17px; position:relative; width:var(--W); height:var(--H); overflow:hidden; background:var(--gradient-background); }
  .screen.tablet { --W:820px; --H:1180px; --btnFont:22.1px; }
  .tablet .H5 { font-size:36.4px; line-height:40px; }
  .tablet .Body1 { font-size:19.5px; line-height:27.3px; }
  .screen > img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; mix-blend-mode:overlay; }
  .dim { position:absolute; inset:0; background:var(--background-quaternary); display:flex; align-items:center; justify-content:center; }
  .card { width:min(calc(var(--W) * 0.9), 520px); height:calc(var(--H) * 0.5); border-radius:30px; overflow:hidden;
          background:var(--feedbackField); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
          border:1px solid rgba(255,255,255,0.25); display:flex; flex-direction:column; }
  .top { display:flex; justify-content:flex-end; flex:none; }
  .x { width:56px; height:56px; display:flex; align-items:center; justify-content:center; }
  /* Close.svg as a template image in --icon-secondary (the file's own ink is not used) */
  .x span { width:24px; height:24px; background:var(--icon-secondary);
            -webkit-mask:url(../../assets/Icons/Close.svg) center / contain no-repeat; mask:url(../../assets/Icons/Close.svg) center / contain no-repeat; }
  .body { display:flex; flex-direction:column; align-items:center; gap:16px; padding:0 24px; text-align:center; }
  .body img { height:96px; }
  .body .Body1 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .sp { flex:1; min-height:16px; }
  .btns { display:flex; gap:12px; padding:0 24px 24px; flex:none; }
  .btns > div { flex:1; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-family:var(--font-namu); font-size:var(--btnFont); color:var(--text-primary); }
  .no { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.22); }
  .yes { background:var(--gradient-controlGreen); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.1); }
</style></head>
<body>
<div class="cap Caption">iPhone 390 × 844 · English · Arabic</div>
<div id="en" class="screen" lang="en"></div>
<div id="ar" class="screen" dir="rtl" lang="ar"></div>
<div class="cap Caption">iPad 820 × 1180 (card 520 wide, type ×1.3) · English · Arabic</div>
<div id="pad" class="screen tablet" lang="en"></div>
<div id="padar" class="screen tablet" dir="rtl" lang="ar"></div>
<script>
const T = {
  en: ['Are you satisfied with our service?', 'Your opinion is important to us. Are you satisfied with the service and it’s quality?', 'No', 'Yes'],
  ar: ['هل أنت راضٍ عن خدمتنا؟', 'رأيك مهم بالنسبة لنا. هل أنت راضٍ عن جودة الخدمة؟', 'لا', 'نعم']
};
for (const [id, l] of [['en','en'],['ar','ar'],['pad','en'],['padar','ar']]) {
  const t = T[l];
  document.getElementById(id).innerHTML =
    `<img src="../../assets/Images/World-Map.png" alt="">
     <div class="dim"><div class="card">
       <div class="top"><div class="x"><span></span></div></div>
       <div class="body"><img src="../../assets/Images/Heart-Rate.svg" alt=""><div class="H5">${t[0]}</div><div class="Body1">${t[1]}</div></div>
       <div class="sp"></div>
       <div class="btns"><div class="no">${t[2]}</div><div class="yes">${t[3]}</div></div>
     </div></div>`;
}
</script>
</body>
</html>
