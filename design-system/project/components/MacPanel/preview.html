<style>
  .list { padding:0 8px 16px; display:flex; flex-direction:column; gap:2px; }
  .row { display:flex; align-items:center; gap:12px; padding:6px 12px; border-radius:var(--radius-listRow); }
  .row.on { background:var(--fieldFill); }
  .flag { border-radius:50%; overflow:hidden; position:relative; flex:none; display:inline-block; }
  .flag img { width:100%; height:100%; object-fit:cover; display:block; }
  .flag::after { content:""; position:absolute; inset:0; border-radius:50%; box-shadow:inset 0 0 0 1px var(--highlight); }
  .name { display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
  .name .t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .full .name .t { white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .fast { color:var(--lightGreen); }
  .pm { width:12px; height:12px; color:var(--lightYellow); flex:none; }
  .bars { display:flex; align-items:flex-end; gap:2px; flex:none; }
  .bars i { width:4px; border-radius:1.5px; background:rgba(255,255,255,0.2); }
  .bars i:nth-child(1) { height:6px; } .bars i:nth-child(2) { height:10px; } .bars i:nth-child(3) { height:14px; }
  .l1 i:nth-child(-n+1), .l2 i:nth-child(-n+2), .l3 i { background:var(--lightGreen); }
  .radio { width:18px; height:18px; border-radius:50%; box-sizing:border-box; border:2px solid var(--auroMetalGray); flex:none; position:relative; }
  .radio.on { border-color:var(--lightGreen); }
  .radio.on::after { content:""; position:absolute; inset:2px; border-radius:50%; background:var(--lightGreen); }
  .sf { display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:var(--radius-field); background:var(--surface); border:1px solid var(--hairline); }
  .sf svg { width:14px; height:14px; color:var(--mediumGray); flex:none; }
  .ph { color:rgba(255,255,255,0.25); }
  .bold { font-weight:700; }
  .btn { display:flex; align-items:center; justify-content:center; border-radius:var(--radius-pill); color:var(--white); box-sizing:border-box; min-height:48px; padding:0 16px; }
  .primary { background:var(--gradient-macPrimary); }
  [dir="rtl"] .primary { background:linear-gradient(270deg, var(--lightBlue), var(--green)); }
  .conn-on { background:var(--surfaceHigh); border:1.5px solid var(--hairline); }
  .strip { display:flex; align-items:center; gap:10px; padding:12px; border-radius:var(--radius-field); background:rgba(250,199,98,0.10); border:1px solid rgba(250,199,98,0.5); }
  .strip > svg { width:16px; height:16px; color:var(--lightYellow); flex:none; }
  .strip .tx { display:flex; flex-direction:column; flex:1; min-width:0; }
  .y { color:var(--lightYellow); } .lg { color:var(--lightGray); } .mg { color:var(--mediumGray); }
  .chev { width:11px; height:11px; color:var(--mediumGray); flex:none; }
  [dir="rtl"] .flip { transform:scaleX(-1); }

  body { margin:0; padding:16px; min-height:100vh; box-sizing:border-box; background:#000; color:var(--white); display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start; }
  figure { margin:0; } figcaption { color:var(--mediumGray); margin-bottom:6px; }
  .panel { width:340px; box-sizing:border-box; padding:16px; display:flex; flex-direction:column; gap:14px; background:linear-gradient(to bottom right, var(--bgGraphit), var(--bgBlack)); border-radius:var(--radius-field); }
  [dir="rtl"].panel { background:linear-gradient(to bottom left, var(--bgGraphit), var(--bgBlack)); }
  .hd { display:flex; align-items:center; gap:10px; } .logo { height:22px; } .sp { flex:1; }
  .stat { display:flex; align-items:center; gap:6px; } .stat i { width:8px; height:8px; border-radius:50%; display:block; }
  .cb { display:flex; flex-direction:column; gap:10px; }
  .timer { font-family:var(--font-mono); font-size:34px; font-weight:600; text-align:center; padding-top:6px; direction:ltr; }
  .loc { display:flex; align-items:center; gap:10px; padding:12px; border-radius:var(--radius-field); background:var(--surface); border:1px solid var(--hairline); }
  .t1 { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .div { height:1px; background:var(--hairline); }
  .ft { display:flex; align-items:center; gap:4px; }
  .fb { width:32px; height:28px; display:flex; align-items:center; justify-content:center; color:var(--lightGray); }
  .fb svg { width:15px; height:15px; }
  .pk { display:flex; flex-direction:column; gap:10px; }
  .pkh { display:flex; align-items:center; } .back { width:28px; height:28px; display:flex; align-items:center; justify-content:center; color:var(--lightGray); } .back svg { width:14px; height:14px; }
  .pl { height:300px; overflow:hidden; border-radius:var(--radius-field); } .pl .list { padding:0 8px 16px; }
