<!-- @dsCard group="Mac" height=360 width=900 subtitle="Mac Connect orb (190, main window): disconnected, connecting (travelling arc), connected (green, glow), disconnecting" -->
<!doctype html>
<html>
<head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow"><title>ConnectOrb — preview</title>
<style>
  body { margin:0; padding:24px; min-height:100vh; box-sizing:border-box; background:linear-gradient(to bottom right, var(--bgGraphit), var(--bgBlack)); color:var(--white); }
  .grid { display:flex; gap:16px; flex-wrap:wrap; }
  figure { margin:0; text-align:center; } figcaption { color:var(--mediumGray); margin-top:10px; }
  svg.orb { width:190px; height:190px; overflow:visible; display:block; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .arc { transform-origin:95px 95px; animation:spin 1.1s linear infinite; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- S = 190. Ring: strokeBorder, width S×0.04 = 7.6 → circle r = 95 − 3.8. Inner: padding S×0.06 = 11.4 → r = 83.6; radial #1E2C40 → #0B121C, endRadius S×0.5 = 95. -->
  <linearGradient id="ringBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0073c5"/><stop offset="0.3333" stop-color="#33a9fe"/><stop offset="0.6667" stop-color="#35df91"/><stop offset="1" stop-color="#178f59"/></linearGradient>
  <linearGradient id="ringGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35df91"/><stop offset="1" stop-color="#198f57"/></linearGradient>
  <linearGradient id="arcG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0073c5"/><stop offset="0.3333" stop-color="#33a9fe"/><stop offset="0.6667" stop-color="#35df91"/><stop offset="1" stop-color="#178f59"/></linearGradient>
  <linearGradient id="symBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0073c5"/><stop offset="0.3333" stop-color="#33a9fe"/><stop offset="0.6667" stop-color="#35df91"/><stop offset="1" stop-color="#178f59"/></linearGradient>
  <linearGradient id="symGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#35df91"/><stop offset="1" stop-color="#198f57"/></linearGradient>
  <radialGradient id="inner" gradientUnits="userSpaceOnUse" cx="95" cy="95" r="95"><stop offset="0" stop-color="#1e2c40"/><stop offset="1" stop-color="#0b121c"/></radialGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30.4"/></filter>
  <!-- power: SF Symbol stand-in, S×0.30 = 57 pt -->
  <g id="pw"><path d="M95 69.5v24" fill="none" stroke-width="6.4" stroke-linecap="round"/><path d="M79.6 78.2a22.7 22.7 0 1 0 30.8 0" fill="none" stroke-width="6.4" stroke-linecap="round"/></g>
</defs></svg>
<div class="grid">
  <figure><svg class="orb" viewBox="0 0 190 190"><circle cx="95" cy="95" r="95" fill="#008ff5" fill-opacity="0.22" filter="url(#blur)"/><circle cx="95" cy="95" r="91.2" fill="none" stroke="url(#ringBlue)" stroke-width="7.6"/><circle cx="95" cy="95" r="83.6" fill="url(#inner)"/><use href="#pw" stroke="url(#symBlue)"/></svg><figcaption class="caption">disconnected</figcaption></figure>
  <figure><svg class="orb" viewBox="0 0 190 190"><circle cx="95" cy="95" r="95" fill="#008ff5" fill-opacity="0.22" filter="url(#blur)"/><circle cx="95" cy="95" r="91.2" fill="none" stroke="url(#ringBlue)" stroke-width="7.6"/><circle cx="95" cy="95" r="83.6" fill="url(#inner)"/><circle class="arc" cx="95" cy="95" r="95" fill="none" stroke="url(#arcG)" stroke-width="7.6" stroke-linecap="round" stroke-dasharray="167.13 1000"/><use href="#pw" stroke="url(#symBlue)"/></svg><figcaption class="caption">connecting (arc spins, 1.1 s)</figcaption></figure>
  <figure><svg class="orb" viewBox="0 0 190 190"><circle cx="95" cy="95" r="95" fill="#1eb972" fill-opacity="0.35" filter="url(#blur)"/><circle cx="95" cy="95" r="91.2" fill="none" stroke="url(#ringGreen)" stroke-width="7.6"/><circle cx="95" cy="95" r="83.6" fill="url(#inner)"/><use href="#pw" stroke="url(#symGreen)"/></svg><figcaption class="caption">connected (glow breathes 1 → 1.12, 2.4 s)</figcaption></figure>
  <figure><svg class="orb" viewBox="0 0 190 190"><circle cx="95" cy="95" r="95" fill="#008ff5" fill-opacity="0.22" filter="url(#blur)"/><circle cx="95" cy="95" r="91.2" fill="none" stroke="url(#ringBlue)" stroke-width="7.6"/><circle cx="95" cy="95" r="83.6" fill="url(#inner)"/><circle class="arc" cx="95" cy="95" r="95" fill="none" stroke="url(#arcG)" stroke-width="7.6" stroke-linecap="round" stroke-dasharray="167.13 1000"/><use href="#pw" stroke="url(#symBlue)"/></svg><figcaption class="caption">disconnecting</figcaption></figure>
</div>
</body>
</html>
